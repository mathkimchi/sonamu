[package]
name = "sonamu_ui"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
sonamu_sync = { workspace = true }

wayland-client = { version = "^0.31", optional = true }
wayland-protocols = { version = "^0.32", features = [
    "client",
], optional = true }
smithay-client-toolkit = { version = "^0.20", optional = true }
calloop = { workspace = true }

# raqote = { version = "^0.8", optional = true }
# font-kit = { version = "^0.14.3", optional = true }
# # pathfinder_canvas = { version = "^0.5.0", optional = true }
# pathfinder_geometry = { version = "^0.5.1", optional = true }

serde = { workspace = true }
# serde_json = { workspace = true }

image = { workspace = true }

# just for winit backend
glyphon = "^0.11"
wgpu.workspace = true
smithay.workspace = true
# importing dmabufs into wgpu
ash = "0.38"
# pollster.workspace = true
bytemuck = { version = "^1.25.0", features = ["derive"] }
ttf-parser = "0.18"                                       # is what msdf uses
msdfgen = "^0.2.1"
dejavu = "^2.37.0"
# cursor themes for the drm backend
xcursor = "^0.3"

# layout (sizing) algorithm; see 2026-10-11 DEVLOG
taffy = "^0.14.0"

log = { workspace = true }

[features]
default = ["winit_backend"]
wayland_backend = [
    "wayland-client",
    "wayland-protocols",
    "smithay-client-toolkit",

    # "raqote",
    # "font-kit",
    # # "pathfinder_canvas",
    # "pathfinder_geometry",
]
winit_backend = []
