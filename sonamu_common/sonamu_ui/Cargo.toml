[package]
name = "sonamu_ui"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
sonamu_sync = { workspace = true }

calloop = { workspace = true }

serde = { workspace = true }
# serde_json = { workspace = true }

# just for winit backend
glyphon = "^0.11"
wgpu.workspace = true
smithay.workspace = true
# importing dmabufs into wgpu
ash = "0.38"
# pollster.workspace = true
bytemuck = { version = "^1.25.0", features = ["derive"] }
ttf-parser = "0.18"                                       # is what msdf uses
msdfgen = "^0.2.1"
dejavu = "^2.37.0"
# cursor themes for the drm backend
xcursor = "^0.3"

# layout (sizing) algorithm; see 2026-10-11 DEVLOG
taffy = "^0.14.0"

log = { workspace = true }

[features]
default = ["winit_backend"]
winit_backend = []
