[package]
name = "sonamu_sttk"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
sonamu_common = { path = "../sonamu_common" }
sonamu_script = { workspace = true }
sonamu_ui = { workspace = true }

serde_json = { workspace = true }

calloop = { workspace = true }
libc = { workspace = true }
slotmap = { workspace = true }

log = { workspace = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
zbus = "6.2.1"
image = { workspace = true, features = ["png"] }
resvg = "0.50.0"

[build-dependencies]
regex = "1.12"

[package.metadata.cargo-machete]
ignored = ["regex"] # used by build.rs
