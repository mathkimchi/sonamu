[workspace]
members = [
    "sonamu_common",
    "sonamu_common/sonamu_ui",
    "sonamu_common/sonamu_command",

    "sonamu_sde",
    "sonamu_sttk",
    "sonamu_standard_tabs",
    # "sonamu_standard_tabs/*", # TODO: make the asterisk work
    # "sonamu_standard_tabs/dylib_math_game",
    "sonamu_sar",
    "sonamu_script",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
schemars = "^1.0"                                         # json schema for the settings
uuid = { version = "^1.23.3", features = ["v4", "serde"] }
slotmap = { version = "^1.1" }                             # like a hashmap but it generates the keys
libc = { version = "^0.2" }

tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
log = { version = "^0.4" }
notify = { version = "^8" }

image = { version = "^0.25" }

wgpu = "^29.0.3"

# Smithay doesn't post the newest version to crates.io
# smithay = { version = "^0.7.0", features = ["wayland_frontend"] }
# default features minus `renderer_pixman` and `renderer_multi` (both pull in pixman, unused)
smithay = { git = "https://github.com/Smithay/smithay", rev = "023b78b1c5a05ca512767cacc07efca55fae8be4", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "backend_x11",
    "backend_winit",
    "backend_vulkan",
    "backend_libei",
    "renderer_gl",
    "xwayland",
    "wayland_frontend",
    "desktop",
    # "backend_egl",
    # "use_system_lib",
    # "wayland-protocols",
] }
wayland-protocols = { version = "0.32.12", features = [
    "unstable",
    "staging",
    "server",
] }

# smithay's polling crate that I will use to replace both server and clients' mainloops
calloop = { version = "^0.14.4", features = ["executor"] }

pollster = "^0.4.0"

sonamu_common = { path = "./sonamu_common" }
sonamu_ui = { path = "./sonamu_common/sonamu_ui" }
sonamu_sync = { path = "./sonamu_common/sonamu_sync" }
sonamu_command = { path = "./sonamu_common/sonamu_command" }
sonamu_script = { path = "./sonamu_script" }

# [[members]]
# singularity_ui = { features = ["iced_backend"] }

[workspace.lints.clippy]
# all = "warn"
pedantic = { level = "warn", priority = -1 }
# nursery = "warn" # these are for experimental lints
cargo = { level = "warn", priority = -1 }

# all the pedantic stuff I'm not going to listen to:

# something with common things to put in a Crate like liscence and stuff
# TODO: enable; I'll do these if I ever put this on crates.io
cargo_common_metadata = "allow"
# I think this technically bloats the system but might be inevitable?
# I also just don't have wifi rn so I can't do anything about it rn...
multiple_crate_versions = "allow"

# Doc suggestions that are too pedantic, especially since it's just me developing rn
doc_markdown = "allow"
too_long_first_doc_paragraph = "allow" # more like too_long_lint_name (bam roasted)
missing_panics_doc = "allow"
missing_errors_doc = "allow"

# opinionated stuff
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
semicolon_if_nothing_returned = "allow"
similar_names = "allow"
unsafe_derive_deserialize = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
must_use_candidate = "allow"                 # having must_use everywhere is getting kinda ugly

[workspace.lints.rust]
unused_qualifications = "warn"
# unused_crate_dependencies = "warn"

# The PDF preview's renderer is ~35x slower unoptimized (1.5 s a page)
[profile.dev.package]
hayro = { opt-level = 3 }
hayro-interpret = { opt-level = 3 }
hayro-syntax = { opt-level = 3 }
vello_cpu = { opt-level = 3 }
vello_common = { opt-level = 3 }
kurbo = { opt-level = 3 }
skrifa = { opt-level = 3 }
read-fonts = { opt-level = 3 }
fearless_simd = { opt-level = 3 }
zlib-rs = { opt-level = 3 }
